name: CI/CD Hugging Face

on:
  push:
    branches:
      - main
      - update
  pull_request:

jobs:
  build-deploy:
    runs-on: ubuntu-latest  # runner Linux pour compatibilité cml et black

    steps:
      # 1️⃣ Récupérer le dépôt
      - uses: actions/checkout@v3

      # 2️⃣ Installer Python 3.11
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 3️⃣ Installer dépendances Python
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black cml

      # 4️⃣ Formater le code
      - name: Format code
        run: make format

      # 5️⃣ Entraîner le modèle
      - name: Train model
        run: make train

      # 6️⃣ Générer le rapport et commenter sur PR
      - name: Generate report
        env:
          CML_GITHUB_TOKEN: ${{ secrets.CML_GITHUB_TOKEN }}
        run: make eval

      # 7️⃣ Déployer sur Hugging Face
      - name: Hugging Face deploy
        env:
          HF: ${{ secrets.HF }}
        run: make deploy
